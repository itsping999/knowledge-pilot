<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>KnowledgePilot</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body data-page="upload">
  <nav class="nav">
    <div class="nav-brand">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
      <span>KnowledgePilot</span>
    </div>
    <div class="nav-links">
      <a href="/upload" class="nav-link active" data-view="upload">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="17,8 12,3 7,8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span data-i18n="upload">Upload</span>
      </a>
      <a href="/qa" class="nav-link" data-view="qa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
        </svg>
        <span data-i18n="qa">Q&amp;A</span>
      </a>
    </div>
    <div class="nav-right">
      <div class="nav-status" id="health-status">
        <span class="status-dot"></span>
        <span class="status-text" data-i18n="checking">Checking...</span>
      </div>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
      </button>
      <button id="lang-toggle" class="lang-btn" type="button">EN</button>
    </div>
    <button id="hamburger" class="hamburger" type="button" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </nav>

  <!-- Mobile nav overlay -->
  <div id="mobile-overlay" class="mobile-nav-overlay">
    <div class="mobile-nav-panel">
      <a href="/upload" class="nav-link active" data-view="upload">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="17,8 12,3 7,8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span data-i18n="upload">Upload</span>
      </a>
      <a href="/qa" class="nav-link" data-view="qa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
        </svg>
        <span data-i18n="qa">Q&amp;A</span>
      </a>
      <div class="mobile-nav-extras">
        <button class="icon-btn mobile-theme-btn" type="button" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
        </button>
        <button class="lang-btn mobile-lang-btn" type="button">EN</button>
      </div>
    </div>
  </div>

  <main class="main">
    <!-- Upload View -->
    <section id="view-upload" class="view">
      <div class="upload-container">
        <div class="card">
          <h2 data-i18n="uploadDoc">Upload Document</h2>
          <form id="upload-form" novalidate>
            <div class="form-group">
              <label for="doc-title"><span data-i18n="title">Title</span> <span class="required">*</span></label>
              <input type="text" id="doc-title" name="title" data-i18n-placeholder="titlePlaceholder" placeholder="Document title" autocomplete="off">
              <span class="field-error" id="error-title"></span>
            </div>
            <div class="form-group">
              <label for="doc-source" data-i18n="source">Source</label>
              <input type="text" id="doc-source" name="source" data-i18n-placeholder="sourcePlaceholder" placeholder="e.g. README.md or enterprise-handbook.md (optional, defaults to local)" autocomplete="off">
            </div>
            <div class="form-group">
              <label for="doc-file" data-i18n="file">File</label>
              <input type="file" id="doc-file" name="file" accept=".md,.markdown,.txt,text/markdown,text/plain">
              <span class="field-help" data-i18n="fileHint">Optional .md or .txt file. When selected, file content is indexed.</span>
            </div>
            <div class="form-group">
              <label for="doc-text"><span data-i18n="content">Content</span></label>
              <textarea id="doc-text" name="text" rows="10" data-i18n-placeholder="contentPlaceholder" placeholder="Paste document content here..."></textarea>
              <span class="field-error" id="error-text"></span>
            </div>
            <button type="submit" id="upload-btn" class="btn btn-primary" data-i18n-html="uploadDoc">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                <polyline points="17,8 12,3 7,8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
              Upload Document
            </button>
          </form>
          <div id="upload-result" class="result-panel hidden"></div>
        </div>
        <div class="card upload-history-card">
          <h2 data-i18n="sessionUploads">Session Uploads</h2>
          <div id="upload-history" class="upload-history">
            <p class="empty-state" data-i18n="noUploads">No documents uploaded yet this session.</p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script src="/static/app.js"></script>
</body>
</html>
